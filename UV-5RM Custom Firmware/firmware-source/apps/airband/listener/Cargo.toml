[workspace]

[package]
name = "airband-listener"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "airband-listener"
test = false
bench = false

[features]
receiver = []
nearby = []
listener = []
default = ["receiver","listener"]

[dependencies]
bf5rh-abi = { path = "../../../abi" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
debug = true
panic = "abort"
